name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dormant-boundary:
    name: Dormant Module Boundary
    if: >-
      github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prevent untested dormant-module changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          unsupported="$(printf '%s\n' "${changed}" | grep -E '^(OozieJavaRestExample|SecureKafkaDev)/|^SecureHiveServer2Query/QueryKerberosAuthLDAPS/' || true)"
          if [ -n "${unsupported}" ]; then
            echo "Dormant modules require modernization and substantive tests before changes:" >&2
            echo "${unsupported}" >&2
            exit 1
          fi

  test:
    name: SecureMapReduce (${{ matrix.distribution }}, Java ${{ matrix.java }})
    if: >-
      github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: apache
            profile: apache-upstream
            java: 17
          - distribution: apache
            profile: apache-upstream
            java: 21
          - distribution: cdp-7.3.2-sp1
            profile: cdp-7.3.2-sp1
            java: 17
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test, package, and enforce coverage
        run: ./mvnw -B -ntp -P${{ matrix.profile }} -pl SecureMapReduce -am clean verify
      - name: Upload coverage report
        if: matrix.java == 17
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secure-mapreduce-${{ matrix.distribution }}-jacoco-report
          path: SecureMapReduce/target/site/jacoco/
          if-no-files-found: error

  hbase-hive-test:
    name: HBase/Hive (${{ matrix.distribution }}, Java ${{ matrix.java }})
    if: >-
      github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: apache
            profile: apache-upstream
            java: 17
          - distribution: apache
            profile: apache-upstream
            java: 21
          - distribution: cdp-7.3.2-sp1
            profile: cdp-7.3.2-sp1
            java: 17
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test, package, and enforce coverage
        run: ./mvnw -B -ntp -P${{ matrix.profile }} -pl HBaseBulkLoad,SecureHiveServer2Query/QueryKerberosAuthHS2 -am clean verify
      - name: Upload coverage reports
        if: matrix.java == 17
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hbase-hive-${{ matrix.distribution }}-jacoco-reports
          path: |
            HBaseBulkLoad/target/site/jacoco/
            SecureHiveServer2Query/QueryKerberosAuthHS2/target/site/jacoco/
          if-no-files-found: error

  dependency-review:
    name: Dependency Review
    if: >-
      github.event_name == 'pull_request' &&
      (vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate

  ci-success:
    name: CI Success
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository)
    needs: [dormant-boundary, test, hbase-hive-test, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          BOUNDARY_RESULT: ${{ needs.dormant-boundary.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          TEST_RESULT: ${{ needs.test.result }}
          HBASE_HIVE_RESULT: ${{ needs.hbase-hive-test.result }}
        run: |
          set -euo pipefail
          test "${BOUNDARY_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
          test "${HBASE_HIVE_RESULT}" = "success"
          test "${DEPENDENCY_REVIEW_RESULT}" = "success" || \
            test "${DEPENDENCY_REVIEW_RESULT}" = "skipped"
