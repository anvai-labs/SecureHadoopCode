name: Owner Private CI

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: owner-private-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OWNER_GITHUB_USER_ID: "5168752"

jobs:
  authorize-owner:
    name: Authorize owner private CI
    environment: owner-private-ci
    if: >-
      vars.OWNER_PRIVATE_CI_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.id == 5168752 &&
      github.actor_id == '5168752' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and same-repository head
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"

  dormant-boundary:
    name: Dormant Module Boundary
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - name: Verify trusted PR identity
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
      - name: Check out exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Prevent untested dormant-module changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          unsupported="$(printf '%s\n' "${changed}" | grep -E '^(OozieJavaRestExample|SecureKafkaDev)/|^SecureHiveServer2Query/QueryKerberosAuthLDAPS/' || true)"
          if [ -n "${unsupported}" ]; then
            echo "Dormant modules require modernization and substantive tests before changes:" >&2
            echo "${unsupported}" >&2
            exit 1
          fi

  test:
    name: SecureMapReduce (${{ matrix.distribution }}, Java ${{ matrix.java }})
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - distribution: apache
            profile: apache-upstream
            java: 17
          - distribution: apache
            profile: apache-upstream
            java: 21
          - distribution: cdp-7.3.2-sp1
            profile: cdp-7.3.2-sp1
            java: 17
    steps:
      - name: Verify trusted PR identity
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
      - name: Check out exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test, package, and enforce coverage
        run: ./mvnw -B -ntp -P${{ matrix.profile }} -pl SecureMapReduce -am clean verify

  hbase-hive-test:
    name: HBase/Hive (${{ matrix.distribution }}, Java ${{ matrix.java }})
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - distribution: apache
            profile: apache-upstream
            java: 17
          - distribution: apache
            profile: apache-upstream
            java: 21
          - distribution: cdp-7.3.2-sp1
            profile: cdp-7.3.2-sp1
            java: 17
    steps:
      - name: Verify trusted PR identity
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
      - name: Check out exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test, package, and enforce coverage
        run: ./mvnw -B -ntp -P${{ matrix.profile }} -pl HBaseBulkLoad,SecureHiveServer2Query/QueryKerberosAuthHS2 -am clean verify

  dependency-review:
    name: Dependency Review
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 10
    steps:
      - name: Check out the exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Check documentation links
        env:
          LYCHEE_ARCHIVE_SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/lychee-x86_64-unknown-linux-musl.tar.gz"
          install_dir="${RUNNER_TEMP}/lychee-v0.24.2"
          curl --fail --location --retry 3 --output "${archive}" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' "${LYCHEE_ARCHIVE_SHA256}" "${archive}" | sha256sum --check --strict
          rm -rf "${install_dir}"
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_dir}"
          "${install_dir}/lychee" --no-progress --root-dir . --max-retries 3 --timeout 30 \
            './**/*.md' './**/*.adoc'
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  ci-success:
    name: CI Success
    if: always() && needs.authorize-owner.result == 'success'
    needs: [authorize-owner, dormant-boundary, test, hbase-hive-test, dependency-review]
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - name: Verify private gates
        env:
          BOUNDARY_RESULT: ${{ needs.dormant-boundary.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          TEST_RESULT: ${{ needs.test.result }}
          HBASE_HIVE_RESULT: ${{ needs.hbase-hive-test.result }}
        run: |
          test "${BOUNDARY_RESULT}" = "success"
          test "${DEPENDENCY_REVIEW_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
          test "${HBASE_HIVE_RESULT}" = "success"
